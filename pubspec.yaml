name: azzorti_captura
description: "Prototipo Modulo M1 V2.4 (Sincronizacion en vivo con dashboard) - FR-SIS-09 V5.1"
publish_to: 'none'
version: 2.4.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  path_provider: ^2.1.1
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_image_labeling: any
  image: ^4.2.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # fondo blanco explicito para el icono adaptativo (el logo es negro/
  # amarillo sobre fondo transparente/blanco, no queremos que Android
  # rellene con un color aleatorio en dispositivos que soportan iconos
  # adaptativos).
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
